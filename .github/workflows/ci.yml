name: CI
on:
  push:
    branches: [main]
  pill_requiest:

jobs:
  tests:
    runs_on: ubuntu-latest
      steps:

        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
            cache: pip
        - name: Install dependencies
          run: pip install -r requirements.txt

        - name: Lint
          run: flake8

        - name: Test
          run: pytest -v
        - name: Build Docker Image
          run: docker build -t uptime-monitor

